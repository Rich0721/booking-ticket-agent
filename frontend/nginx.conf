server {
    listen 80;
    server_name _;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css text/javascript application/json application/javascript application/xml+rss application/rss+xml;
    gzip_vary on;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # Serve static files
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA routing - all requests to index.html except for specific paths
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Deny access to specific files
    location ~ /\.git {
        deny all;
    }
}
